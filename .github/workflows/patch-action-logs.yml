name: Apply retained action log correction

on:
  push:
    branches: [milestone/0.12-clean-workstation]
    paths: [.github/workflows/patch-action-logs.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone/0.12-clean-workstation
      - name: Correct retained field names
        shell: bash
        run: |
          sed -i 's/action.get("id")/action.get("action_id")/g' tools/acceptance/run_acceptance.py
          sed -i 's/attempt.get("message")/attempt.get("summary")/g' tools/acceptance/run_acceptance.py
          git diff --check
          git diff -- tools/acceptance/run_acceptance.py
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/acceptance/run_acceptance.py
          git commit -m "fix(acceptance): retain action ownership and summaries"
          git push origin HEAD:milestone/0.12-clean-workstation
