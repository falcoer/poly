name: Apply roadmap validation corrections

on:
  push:
    branches:
      - milestone/0.12-clean-workstation
    paths:
      - .github/workflows/patch-roadmap-012.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone/0.12-clean-workstation
          fetch-depth: 0
      - name: Update roadmap states and evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ROADMAP.md")
          value = path.read_text(encoding="utf-8")
          old_0102 = '''## 0.10.2 — Runtime output and release identity corrections\n\n- Status: `implemented-awaiting-ci`'''
          new_0102 = '''## 0.10.2 — Runtime output and release identity corrections\n\n- Status: `validated`'''
          if old_0102 in value:
              value = value.replace(old_0102, new_0102, 1)
          marker = '''- Excluded: installed external-driver lifecycle, which remains 0.11; any new\n  workspace or driver capability.\n\n## 0.11 — Runtime driver lifecycle and inventory'''
          replacement = '''- Excluded: installed external-driver lifecycle, which remains 0.11; any new\n  workspace or driver capability.\n- Validation:\n  - the exact 0.10.2 boundary commit is `1c1346cb032b3429095091f173e5c6a5b766383c`;\n  - dedicated GitHub Actions run `33598204087` checked out that exact commit and\n    passed the Linux/Windows, formatting, lint, strict typing, coverage,\n    clean-room external-driver, build, and 0.10.2 identity gates;\n  - the remote immutable annotated tag `roadmap/0.10.2-runtime-corrections`\n    targets exactly that commit. The later 0.11 CI was not used as a substitute\n    for the missing 0.10.2 distribution-identity proof.\n\n## 0.11 — Runtime driver lifecycle and inventory'''
          if marker in value and "dedicated GitHub Actions run `33598204087`" not in value:
              value = value.replace(marker, replacement, 1)
          old_012 = '''## 0.12 — Clean-workstation functional acceptance\n\n- Status: `pending`'''
          new_012 = '''## 0.12 — Clean-workstation functional acceptance\n\n- Status: `implemented-awaiting-ci`'''
          if old_012 in value:
              value = value.replace(old_012, new_012, 1)
          path.write_text(value, encoding="utf-8")
          PY
          git diff --check
          git diff -- ROADMAP.md
      - name: Commit roadmap update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs(roadmap): record 0.10.2 validation and stage 0.12"
          git push origin HEAD:milestone/0.12-clean-workstation
