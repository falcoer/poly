name: Apply Windows Maven launcher correction

on:
  push:
    branches:
      - milestone/0.12-clean-workstation
    paths:
      - .github/workflows/patch-maven-windows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone/0.12-clean-workstation
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch Maven launcher selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/poly/drivers/maven.py")
          value = path.read_text(encoding="utf-8")
          old = '''        else "mvn"\n    )'''
          new = '''        else "mvn.cmd" if os.name == "nt" else "mvn"\n    )'''
          if old not in value:
              if new in value:
                  raise SystemExit(0)
              raise SystemExit("expected Maven launcher expression not found")
          path.write_text(value.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- src/poly/drivers/maven.py
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/poly/drivers/maven.py
          git commit -m "fix(maven): select Windows command launcher"
          git push origin HEAD:milestone/0.12-clean-workstation
