name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv build
      - name: Validate release artifact identity
        shell: bash
        run: |
          test -f dist/poly-0.11.0-py3-none-any.whl
          test -f dist/poly-0.11.0.tar.gz
          uv run python -c 'import importlib.metadata,poly,zipfile; assert poly.__version__ == importlib.metadata.version("poly") == "0.11.0"; archive=zipfile.ZipFile("dist/poly-0.11.0-py3-none-any.whl"); metadata=archive.read("poly-0.11.0.dist-info/METADATA").decode(); assert "Name: poly\nVersion: 0.11.0\n" in metadata'

  external-driver-clean-room:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - name: Build Poly distributions
        run: uv build
      - name: Generate external driver
        run: |
          target="$RUNNER_TEMP/poly-driver-sample-tech"
          uv run poly driver new sample-tech \
            --path "$target" \
            --poly-source "$GITHUB_WORKSPACE"
          echo "target=$target" >> "$GITHUB_ENV"
      - name: Validate external driver
        run: |
          cd "$target"
          uv sync --all-groups
          uv run poly-driver-test validate
          uv run poly-driver-test inspect poly_driver_sample_tech:driver --workspace tests/fixtures/workspace
          uv run poly-driver-test determinism poly_driver_sample_tech:driver --workspace tests/fixtures/workspace --verb sample-status
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests
          uv run pytest
          uv build
      - name: Install wheels and exercise the production runtime
        shell: bash
        run: |
          clean="$RUNNER_TEMP/poly-clean-room"
          workspace="$RUNNER_TEMP/poly-workspace"
          uv venv --python 3.12 "$clean"
          uv pip install --python "$clean/bin/python" \
            dist/poly-0.11.0-py3-none-any.whl \
            "$target/dist/poly_driver_sample_tech-0.1.0-py3-none-any.whl"
          poly="$clean/bin/poly"
          "$poly" --version | grep -Fx "poly 0.11.0"
          mkdir -p "$workspace"
          "$poly" init --workspace "$workspace" --name "0.10.2 representative" --format json
          printf 'sample\n' > "$workspace/sample.project"
          "$poly" drivers --workspace "$workspace" --format json > "$RUNNER_TEMP/drivers.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/drivers.json")); x=next(v for v in d["drivers"] if v["name"]=="poly.driver.sample-tech"); assert x["status"]=="loaded" and x["verbs"]==["sample-status"] and x["origin"].startswith("installed:")'
          "$poly" sample-status --workspace "$workspace" --select root --format json > "$RUNNER_TEMP/run.json"
          run_id=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/run.json"))["plan"]["id"])')
          "$poly" report "$run_id" --workspace "$workspace" --format json > "$RUNNER_TEMP/report.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/report.json")); assert d["inventory"]["nodes"][0]["id"]=="root"; assert "sample/project" in d["inventory"]["nodes"][0]["natures"]; assert d["run"]["status"]=="succeeded"; assert d["run"]["actions"][0]["attempt"]["stdout"].strip()=="sample project is available"; assert any(e["state"]=="succeeded" for e in d["run"]["events"])'

  workspace-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest

  milestone-tag:
    needs: [quality, external-driver-clean-room, workspace-contract]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create validated milestone tag
        shell: bash
        run: |
          marker=.poly/milestone-tag
          test -f "$marker" || exit 0
          tag=$(tr -d '\r\n' < "$marker")
          test -n "$tag" || exit 0
          case "$tag" in
            roadmap/*) ;;
            *) echo "Invalid milestone tag: $tag" >&2; exit 1 ;;
          esac
          grep -F "Tag: \`$tag\`" ROADMAP.md >/dev/null
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Validated roadmap milestone $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
