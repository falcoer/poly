name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv build

  external-driver-clean-room:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - name: Generate external driver
        run: |
          target="$RUNNER_TEMP/poly-driver-sample-tech"
          uv run poly driver new sample-tech \
            --path "$target" \
            --poly-source "$GITHUB_WORKSPACE"
          echo "target=$target" >> "$GITHUB_ENV"
      - name: Validate external driver
        run: |
          cd "$target"
          uv sync --all-groups
          uv run poly-driver-test validate
          uv run poly-driver-test inspect poly_driver_sample_tech:driver --workspace tests/fixtures/workspace
          uv run poly-driver-test determinism poly_driver_sample_tech:driver --workspace tests/fixtures/workspace --verb sample-status
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests
          uv run pytest
          uv build

  workspace-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest

  milestone-tag:
    needs: [quality, external-driver-clean-room, workspace-contract]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create validated milestone tag
        shell: bash
        run: |
          marker=.poly/milestone-tag
          test -f "$marker" || exit 0
          tag=$(tr -d '\r\n' < "$marker")
          test -n "$tag" || exit 0
          case "$tag" in
            roadmap/*) ;;
            *) echo "Invalid milestone tag: $tag" >&2; exit 1 ;;
          esac
          grep -F "Tag: \`$tag\`" ROADMAP.md >/dev/null
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Validated roadmap milestone $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
