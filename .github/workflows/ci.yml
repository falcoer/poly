name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - name: Test with coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          uv run pytest --cov-report=term-missing --cov-report=json:evidence/coverage.json --junitxml=evidence/junit.xml | tee evidence/pytest.txt
      - run: uv build
      - name: Validate release artifact identity and write metadata
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import pathlib
          import zipfile
          import poly

          version = "0.12.3"
          dist = pathlib.Path("dist")
          wheel = dist / f"poly-{version}-py3-none-any.whl"
          sdist = dist / f"poly-{version}.tar.gz"
          assert wheel.is_file()
          assert sdist.is_file()
          assert poly.__version__ == importlib.metadata.version("poly") == version
          with zipfile.ZipFile(wheel) as archive:
              metadata = archive.read(f"poly-{version}.dist-info/METADATA").decode()
          assert f"Name: poly\nVersion: {version}\n" in metadata

          rows = []
          for path in (wheel, sdist):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append({"name": path.name, "size": path.stat().st_size, "sha256": digest})
          (dist / "SHA256SUMS").write_text(
              "".join(f"{row['sha256']}  {row['name']}\n" for row in rows), encoding="utf-8"
          )
          (dist / "build-metadata.json").write_text(
              json.dumps(
                  {
                      "schema": "poly.release-artifacts/v1",
                      "version": version,
                      "commit": os.environ["GITHUB_SHA"],
                      "artifacts": rows,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: poly-0.12.3-distributions-${{ github.sha }}
          path: |
            dist/poly-0.12.3-py3-none-any.whl
            dist/poly-0.12.3.tar.gz
            dist/SHA256SUMS
            dist/build-metadata.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: poly-0.12.3-quality-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  external-driver-clean-room:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - name: Generate external driver
        shell: bash
        run: |
          target="$RUNNER_TEMP/poly-driver-sample-tech"
          uv run poly driver new sample-tech --path "$target" --poly-source "$GITHUB_WORKSPACE"
          echo "target=$target" >> "$GITHUB_ENV"
      - name: Validate generated driver
        shell: bash
        run: |
          set -euo pipefail
          cd "$target"
          uv sync --locked --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
      - name: Install generated wheel into clean environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$target"
          uv build
          python -m venv "$RUNNER_TEMP/poly-driver-clean"
          "$RUNNER_TEMP/poly-driver-clean/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/poly-driver-clean/bin/python" - <<'PY'
          from importlib.metadata import entry_points
          drivers = entry_points(group="poly.drivers")
          assert any(driver.name == "sample-tech" for driver in drivers)
          PY

  windows-quality:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest --no-cov
