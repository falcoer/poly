name: Finalize 0.12 validation docs

on:
  push:
    branches:
      - release/0.12-validation-docs
    paths:
      - .github/workflows/finalize-012-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.12-validation-docs
      - name: Patch validation evidence
        shell: python
        run: |
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          marker = '## 0.12 — Clean-workstation functional acceptance\n\n- Status: `implemented-awaiting-ci`'
          replacement = '## 0.12 — Clean-workstation functional acceptance\n\n- Status: `validated`'
          if marker not in text:
              raise SystemExit('0.12 roadmap status marker not found')
          text = text.replace(marker, replacement, 1)
          evidence = '''\n- Validation:\n  - functional merge commit: `a41159b93ccc3580dbfbbca17a85bf5c553726e5`;\n  - GitHub Actions run `33623639390` passed quality, Ubuntu/Windows workspace contracts, deterministic fixture, external-driver clean-room, and POSIX/Windows clean-workstation acceptance;\n  - retained distribution, quality, fixture, Linux acceptance, and Windows acceptance artifacts all report head SHA `a41159b93ccc3580dbfbbca17a85bf5c553726e5`;\n  - immutable annotated tag `roadmap/0.12-functional-baseline` (tag object `2870e961b8e565751ab253934eac2ef49294768c`) targets exactly the functional merge commit.\n'''
          anchor = '- Excluded: Web UI, parallel execution, child commit/push/merge, remote package\n  publication, and production sandbox hardening.'
          if anchor not in text:
              raise SystemExit('0.12 roadmap exclusion anchor not found')
          text = text.replace(anchor, anchor + evidence, 1)
          roadmap.write_text(text, encoding='utf-8')

          release = Path('docs/releases/0.12.0.md')
          r = release.read_text(encoding='utf-8')
          r = r.replace('implemented, awaiting CI validation', 'validated', 1)
          r += '''\n\n## Final validation\n\n- Functional commit: `a41159b93ccc3580dbfbbca17a85bf5c553726e5`.\n- CI: run `33623639390`, fully green on `main`.\n- Annotated immutable tag: `roadmap/0.12-functional-baseline`.\n- Tag object: `2870e961b8e565751ab253934eac2ef49294768c`, targeting the functional commit exactly.\n- Retained artifacts: distributions, quality evidence, deterministic fixture, Linux acceptance evidence, and Windows acceptance evidence from the tagged commit.\n'''
          release.write_text(r, encoding='utf-8')
      - name: Remove one-shot workflow and commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-012-docs.yml
          git add ROADMAP.md docs/releases/0.12.0.md
          git commit -m "docs(release): validate Poly 0.12"
          git push origin HEAD:release/0.12-validation-docs
