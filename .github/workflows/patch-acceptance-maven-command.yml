name: Patch Windows acceptance Maven command

on:
  push:
    branches:
      - milestone/0.12-clean-workstation
    paths:
      - .github/workflows/patch-acceptance-maven-command.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone/0.12-clean-workstation
      - name: Patch acceptance environment probe
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/acceptance/run_acceptance.py')
          text = path.read_text(encoding='utf-8')
          old = '"maven": _run(["mvn", "--version"]).stdout.splitlines()[0],'
          new = '"maven": _run(["mvn.cmd" if os.name == "nt" else "mvn", "--version"]).stdout.splitlines()[0],'
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/acceptance/run_acceptance.py
          git commit -m "fix(acceptance): resolve Maven launcher on Windows"
          git push origin HEAD:milestone/0.12-clean-workstation
