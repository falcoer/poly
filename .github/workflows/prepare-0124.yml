name: Prepare 0.12.4 rendering corrections

on:
  push:
    branches:
      - release/0.12.4-cli-rendering-corrections

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.12.4-cli-rendering-corrections
          fetch-depth: 0
      - name: Apply rendering and roadmap corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/poly/reporting.py')
          text = path.read_text(encoding='utf-8')

          old = '''    if verbosity >= 0:\n        lines.append(separator)\n        lines.append(_command_heading(document))\n'''
          new = '''    if verbosity >= 0:\n        lines.append(_command_heading(document))\n'''
          if old not in text:
              raise SystemExit('render_cli heading pattern not found')
          text = text.replace(old, new, 1)

          old = '''    lines = [\n        _styled("─" * _usable_width(width), "muted", color),\n        _command_heading(document),\n    ]\n'''
          new = '''    lines = [_command_heading(document)]\n'''
          if old not in text:
              raise SystemExit('render_cli_start pattern not found')
          text = text.replace(old, new, 1)

          old = '''    label = "PLAN KO" if failed else "PLAN WARN" if blocked else "PLAN"\n    prefix = f"{_SECTION_INDENT}{label:<10}"\n'''
          new = '''    label = (\n        "IN PROGRESS KO"\n        if failed\n        else "IN PROGRESS WARN"\n        if blocked\n        else "IN PROGRESS"\n    )\n    prefix = f"{_SECTION_INDENT}{label} "\n'''
          if old not in text:
              raise SystemExit('progress label pattern not found')
          text = text.replace(old, new, 1)

          old = '''        compact_label = "KO" if failed else "WARN" if blocked else "PLAN"\n        compact = f"{compact_label} {bounded_completed}/{bounded_total} {percentage}%"\n'''
          new = '''        compact_label = (\n            "IN PROGRESS KO"\n            if failed\n            else "IN PROGRESS WARN"\n            if blocked\n            else "IN PROGRESS"\n        )\n        compact = f"{compact_label} {bounded_completed}/{bounded_total} {percentage}%"\n'''
          if old not in text:
              raise SystemExit('compact progress pattern not found')
          text = text.replace(old, new, 1)

          start = text.index('def _render_planned_cli(')
          end = text.index('\n\ndef _command_heading', start)
          replacement = '''def _render_planned_cli(\n    document: ReportDocument, command: str, verbosity: int, color: bool, width: int\n) -> str:\n    prepared = document.get("prepared", {})\n    request = document.get("request", {})\n    count_value = prepared.get("command_count", 0) if isinstance(prepared, dict) else 0\n    count = int(count_value) if isinstance(count_value, int | str) else 0\n    verb = str(request.get("verb", "command")) if isinstance(request, dict) else "command"\n    noun = "command" if count == 1 else "commands"\n    separator = _styled("─" * _usable_width(width), "white", color)\n    if verbosity < 0:\n        return _styled(f"○ PLANNED  poly {verb}", "magenta", color) + "\\n"\n\n    lines = [_command_heading(document)]\n    if verbosity >= 1:\n        lines.append(f"{_SECTION_INDENT}COMMAND  {command}")\n\n    body = (\n        f"○ PLANNED  poly {verb}",\n        f"{count} {noun} in current plan",\n        "Run `poly exec` when the plan is ready.",\n    )\n    for index, line in enumerate(body):\n        gutter = _styled("│", "white", color)\n        indent = "  " if index == 0 else "    "\n        lines.append(f"{gutter}{indent}{_styled(line, 'magenta', color)}")\n    lines.append(separator)\n    return "\\n".join(lines) + "\\n"\n'''
          text = text[:start] + replacement + text[end:]

          old = '''        "magenta": "35",\n        "muted": "90",\n'''
          new = '''        "magenta": "35",\n        "white": "37",\n        "muted": "90",\n'''
          if old not in text:
              raise SystemExit('style palette pattern not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          roadmap_text = roadmap.read_text(encoding='utf-8')
          marker = '## 0.13 — Bounded parallel plan execution\n'
          if marker not in roadmap_text:
              raise SystemExit('0.13 roadmap marker not found')
          if '## 0.12.4 — Interactive rendering corrections' not in roadmap_text:
              section = '''## 0.12.4 — Interactive rendering corrections\n\n- Status: `in-progress`\n- Tag: `roadmap/0.12.4-interactive-rendering-corrections`\n- Depends on: 0.12.3 deferred command preparation implementation.\n- Scope: correct the interactive presentation discovered during large-batch field\n  use without changing command-journal, planning, execution, or structured-report\n  semantics. The scope intentionally remains open for one additional correction\n  currently being prepared.\n- Current acceptance:\n  - command announcements start directly with the user-facing heading in the\n    terminal default foreground color and never have a horizontal separator above;\n  - prepared-command status uses a white vertical gutter, three magenta `PLANNED`\n    lines, and exactly one white horizontal separator below the block;\n  - the global execution progress row uses `IN PROGRESS`, `IN PROGRESS WARN`, or\n    `IN PROGRESS KO` instead of labelling runtime progress as `PLAN`;\n  - redirected text preserves the same layout without ANSI controls, and JSON,\n    YAML, and XML canonical semantics remain unchanged.\n- Checks: focused renderer snapshots with and without color, generic command-start\n  regression, progress-state variants, existing terminal tests, and the complete\n  Windows/Linux quality and acceptance matrix.\n- Excluded for now: semantic changes to prepared plans, execution scheduling, or\n  persistence; final scope freeze until the additional correction is added.\n\n'''
              roadmap_text = roadmap_text.replace(marker, section + marker, 1)
              roadmap.write_text(roadmap_text, encoding='utf-8')
          PY
      - name: Format and focused tests
        shell: bash
        run: |
          python -m pip install uv
          uv sync --locked --all-groups
          uv run ruff format src/poly/reporting.py tests/test_release_0124_cli_rendering.py
          uv run ruff check src/poly/reporting.py tests/test_release_0124_cli_rendering.py
          uv run pytest tests/test_reporting.py tests/test_terminal.py tests/test_deferred_preparation.py tests/test_release_0124_cli_rendering.py
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/poly/reporting.py tests/test_release_0124_cli_rendering.py ROADMAP.md
          git commit -m "fix: refine 0.12.4 interactive CLI rendering"
          git push origin HEAD:release/0.12.4-cli-rendering-corrections
