name: Apply action owner key correction
on:
  push:
    branches: [milestone/0.12-clean-workstation]
    paths: [.github/workflows/patch-action-owner.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone/0.12-clean-workstation
      - shell: bash
        run: |
          sed -i '0,/str(action.get("action_id")): action.get("driver")/s//str(action.get("id")): action.get("driver")/' tools/acceptance/run_acceptance.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/acceptance/run_acceptance.py
          git commit -m "fix(acceptance): preserve planned action owners"
          git push origin HEAD:milestone/0.12-clean-workstation
