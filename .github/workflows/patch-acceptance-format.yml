name: Patch acceptance formatting

on:
  push:
    branches:
      - milestone/0.12-clean-workstation
    paths:
      - .github/workflows/patch-acceptance-format.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone/0.12-clean-workstation
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Format acceptance runner
        run: |
          uv sync --locked --all-groups
          uv run ruff format tools/acceptance/run_acceptance.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/acceptance/run_acceptance.py
          git commit -m "style(acceptance): format Windows Maven probe"
          git push origin HEAD:milestone/0.12-clean-workstation
